name: CodeQL

# CodeQL runs through this one workflow, never GitHub's default setup (default setup scans every
# PR and cannot exclude paths). Two entry points:
#   - workflow_call from a realm's release.yml: the tag-time publish gate.
#   - schedule / workflow_dispatch: the weekly baseline. Each scattered realm carries a thin
#     .github/workflows/codeql.yml caller; this repo (not a scatter target) runs it directly.
# Tests and vendored libs are skipped by the scattered .github/codeql/codeql-config.yml.
#
# Setup steps (checkout, .NET/Node, restore) are intentionally inline.
# Composite actions cannot be called from within a reusable workflow — the runner
# checks out the CALLER's repository, so any ./ path resolves there, not here.

on:
  workflow_call:
    inputs:
      language:
        description: 'CodeQL language to analyze (actions, csharp, javascript-typescript); empty detects from the repository'
        type: string
        required: false
        default: ''
      config-file:
        description: 'CodeQL config path in the caller checkout; empty uses the scattered .github/codeql/codeql-config.yml'
        type: string
        required: false
        default: ''
  schedule:
    - cron: '17 4 * * 1'
  workflow_dispatch:

permissions:
  contents: read
  security-events: write

env:
  # This repo is the config's source, so its copies sit under config/ rather than at the scattered paths.
  GLOBAL_JSON: ${{ github.repository == 'NorseArchitecture/.github' && './config/global.json' || './global.json' }}
  CODEQL_CONFIG: ${{ inputs.config-file || (github.repository == 'NorseArchitecture/.github' && './config/.github/codeql/codeql-config.yml' || './.github/codeql/codeql-config.yml') }}

jobs:
  detect:
    runs-on: ubuntu-latest
    outputs:
      languages: ${{ steps.detect.outputs.languages }}
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Detect languages
        id: detect
        env:
          LANGUAGE: ${{ inputs.language }}
        run: |
          if [ -n "$LANGUAGE" ]; then
            languages=$(jq -cn --arg l "$LANGUAGE" '[$l]')
          else
            languages='[]'
            add() { languages=$(jq -c --arg l "$1" '. + [$l]' <<<"$languages"); }
            [ -n "$(git ls-files '.github/workflows/*.yml' '.github/workflows/*.yaml')" ] && add actions
            # csharp needs a root solution (this repo's csproj files are test fixtures, not code to scan).
            [ -n "$(git ls-files '*.csproj')" ] && [ -n "$(git ls-files '*.sln' '*.slnx' ':!:*/*')" ] && add csharp
            [ -n "$(git ls-files '*.ts' '*.tsx' '*.js' '*.jsx' '*.mjs' ':!:**/node_modules/**' ':!:**/wwwroot/lib/**' ':!:**/tests/**')" ] && add javascript-typescript
          fi
          echo "languages=$languages" >> "$GITHUB_OUTPUT"

  analyze:
    needs: detect
    if: needs.detect.outputs.languages != '[]'
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        language: ${{ fromJSON(needs.detect.outputs.languages) }}
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup .NET
        if: matrix.language == 'csharp'
        uses: actions/setup-dotnet@v6
        with:
          global-json-file: ${{ env.GLOBAL_JSON }}

      - name: Setup Node
        if: matrix.language == 'javascript-typescript' && hashFiles('package-lock.json') != ''
        uses: actions/setup-node@v7
        with:
          node-version: '24'

      - name: Initialize CodeQL
        uses: github/codeql-action/init@v4
        with:
          languages: ${{ matrix.language }}
          # Buildless everywhere (what default setup does): a traced C# build extracts every compiled file and
          # the paths-ignore in the shared config would not take effect. Buildless restores packages itself.
          build-mode: none
          config-file: ${{ env.CODEQL_CONFIG }}
        env:
          NUGET_AUTH_TOKEN: ${{ secrets.PACKAGES_READ_TOKEN }}

      - name: Install dependencies (javascript-typescript)
        if: matrix.language == 'javascript-typescript' && hashFiles('package-lock.json') != ''
        run: npm ci

      - name: Analyze
        uses: github/codeql-action/analyze@v4
        with:
          category: /language:${{ matrix.language }}
