name: CodeQL

# CodeQL runs through this one workflow, never GitHub's default setup (default setup scans every
# PR and cannot exclude paths). Two entry points:
#   - workflow_call from a realm's release.yml: the tag-time publish gate.
#   - schedule / workflow_dispatch: the weekly baseline. Each scattered realm carries a thin
#     .github/workflows/codeql.yml caller; this repo (not a scatter target) runs it directly.
# C# runs as a traced (manual) build of the src/ and gen/ projects only, so source-generator output is
# extracted as the compiler sees it and test projects are never compiled, hence never scanned. paths-ignore
# does not apply to a traced build; leaving tests out of the build is the filter. MinVer is skipped: it
# only stamps versions, and its git probe fails under the tracer. The scattered
# .github/codeql/codeql-config.yml still skips tests and vendored libs for the interpreted languages.
#
# Setup steps (checkout, .NET/Node, restore) are intentionally inline.
# Composite actions cannot be called from within a reusable workflow — the runner
# checks out the CALLER's repository, so any ./ path resolves there, not here.

on:
  workflow_call:
    inputs:
      language:
        description: 'CodeQL language to analyze (actions, csharp, javascript-typescript); empty detects from the repository'
        type: string
        required: false
        default: ''
      config-file:
        description: 'CodeQL config path in the caller checkout; empty uses the scattered .github/codeql/codeql-config.yml'
        type: string
        required: false
        default: ''
  schedule:
    - cron: '17 4 * * 1'
  workflow_dispatch:

permissions:
  contents: read
  security-events: write

env:
  # This repo is the config's source, so its copies sit under config/ rather than at the scattered paths.
  GLOBAL_JSON: ${{ github.repository == 'NorseArchitecture/.github' && './config/global.json' || './global.json' }}
  CODEQL_CONFIG: ${{ inputs.config-file || (github.repository == 'NorseArchitecture/.github' && './config/.github/codeql/codeql-config.yml' || './.github/codeql/codeql-config.yml') }}

jobs:
  detect:
    runs-on: ubuntu-latest
    outputs:
      languages: ${{ steps.detect.outputs.languages }}
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Detect languages
        id: detect
        env:
          LANGUAGE: ${{ inputs.language }}
        run: |
          if [ -n "$LANGUAGE" ]; then
            languages=$(jq -cn --arg l "$LANGUAGE" '[$l]')
          else
            languages='[]'
            add() { languages=$(jq -c --arg l "$1" '. + [$l]' <<<"$languages"); }
            [ -n "$(git ls-files '.github/workflows/*.yml' '.github/workflows/*.yaml')" ] && add actions
            # csharp needs a root solution (this repo's csproj files are test fixtures, not code to scan).
            [ -n "$(git ls-files '*.csproj')" ] && [ -n "$(git ls-files '*.sln' '*.slnx' ':!:*/*')" ] && add csharp
            [ -n "$(git ls-files '*.ts' '*.tsx' '*.js' '*.jsx' '*.mjs' ':!:**/node_modules/**' ':!:**/wwwroot/lib/**' ':!:**/tests/**')" ] && add javascript-typescript
          fi
          echo "languages=$languages" >> "$GITHUB_OUTPUT"

  analyze:
    needs: detect
    if: needs.detect.outputs.languages != '[]'
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        language: ${{ fromJSON(needs.detect.outputs.languages) }}
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Setup .NET
        if: matrix.language == 'csharp'
        uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68 # v6.0.0
        with:
          global-json-file: ${{ env.GLOBAL_JSON }}

      - name: Setup Node
        if: matrix.language == 'javascript-typescript' && hashFiles('bun.lock') != ''
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '24'

      # Both languages: the JS install below uses it, and a C# build can shell to it (Naglfar's token
      # pipeline). A realm with no bun.lock skips this.
      - name: Setup Bun
        if: hashFiles('bun.lock') != ''
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: latest

      - name: Initialize CodeQL
        uses: github/codeql-action/init@9b3254085494b55a0f7c4c2b3d2d52cc712ce370 # v4.39.1
        with:
          languages: ${{ matrix.language }}
          build-mode: ${{ matrix.language == 'csharp' && 'manual' || 'none' }}
          config-file: ${{ env.CODEQL_CONFIG }}

      # The solution says which workloads its build needs (same step as ci-build-test.yml); a realm that
      # needs none restores nothing.
      - name: Restore .NET workloads
        if: matrix.language == 'csharp'
        run: dotnet workload restore

      # Every project under src/ and gen/ (tests, benchmarks and tools are not built). Shared compilation
      # is off so every csc invocation runs under the tracer.
      - name: Build (csharp)
        if: matrix.language == 'csharp'
        env:
          NUGET_AUTH_TOKEN: ${{ secrets.PACKAGES_READ_TOKEN }}
        run: |
          git ls-files 'src/*.csproj' 'gen/*.csproj' | while read -r project; do
            dotnet build "$project" -p:UseSharedCompilation=false -p:MinVerSkip=true
          done

      - name: Install dependencies (javascript-typescript)
        if: matrix.language == 'javascript-typescript' && hashFiles('bun.lock') != ''
        run: bun install --frozen-lockfile

      - name: Analyze
        uses: github/codeql-action/analyze@9b3254085494b55a0f7c4c2b3d2d52cc712ce370 # v4.39.1
        with:
          category: /language:${{ matrix.language }}
